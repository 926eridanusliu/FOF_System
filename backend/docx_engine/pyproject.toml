[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-docx-engine"
version = "1.0.0"
description = "Bookmark-driven modular DOCX generation engine"
requires-python = ">=3.10"
dependencies = [
  "lxml",
  "python-docx",
]

[tool.setuptools]
packages = ["docx_engine"]
package-dir = {docx_engine = "."}
